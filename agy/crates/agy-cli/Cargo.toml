[package]
name = "agy-cli"
version = "3.0.0"
edition = "2021"
authors = ["Antigravity Core Team"]
description = "Autonomous Headless CLI for Absolute Antigravity"

[[bin]]
name = "agy"
path = "src/main.rs"

[dependencies]
agy-core = { path = "../agy-core" }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
