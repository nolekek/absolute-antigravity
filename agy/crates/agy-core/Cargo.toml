[package]
name = "agy-core"
version = "3.0.0"
edition = "2021"
authors = ["Antigravity Core Team"]
description = "Core library for Absolute Antigravity CLI suite"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
chrono = "0.4"
base64 = "0.22"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
junction = "2.1"
windows-sys = { version = "0.59", features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tempfile = "3.10"
