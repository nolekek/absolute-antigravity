<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Antigravity Modern AI Studio</title>
  <meta name="description" content="Next-Gen AI Development Environment for Antigravity" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Custom scrollbars and base glass styles */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090a0f;
    }
    ::-webkit-scrollbar-thumb {
      background: #1d2233;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2d3748;
    }
    body {
      background-color: #090a0f;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    input, textarea, [contenteditable="true"] {
      user-select: text;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-studio-bg text-studio-text antialiased selection:bg-studio-accent/30 selection:text-white">
  <div id="root" class="h-screen w-screen flex flex-col overflow-hidden"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
